name: PR05 temporary failing test report
on:
  push:
    branches: ["pr/05-hypothesis-qualification"]
permissions:
  contents: write
jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Record detailed pytest failures
        run: |
          pytest -q --tb=short > .pr05_test_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr05_test_diagnostics.txt
          git commit -m "chore(pr05): capture temporary pytest diagnostics"
          git push origin HEAD:pr/05-hypothesis-qualification
