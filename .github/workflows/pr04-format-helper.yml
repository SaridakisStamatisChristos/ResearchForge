name: Temporary PR04 format helper
on:
  push:
    branches: ["pr/04-trusted-local-runner"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.8,<1"
      - name: Format PR04 files only and push to PR branch
        run: |
          ruff format src/researchforge/application/runner.py src/researchforge/cli.py tests/integration/test_runner.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/researchforge/application/runner.py src/researchforge/cli.py tests/integration/test_runner.py
            git commit -m "style(pr04): apply Ruff formatter"
            git push origin HEAD:pr/04-trusted-local-runner
          fi
