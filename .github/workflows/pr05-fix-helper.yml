name: Temporary PR05 quality fixer
on:
  push:
    branches: ["pr/05-hypothesis-qualification"]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"
      - name: Apply safe Ruff fixes and formatting to PR05 files
        run: |
          ruff check --fix src/researchforge/application/runner.py src/researchforge/application/qualification.py src/researchforge/cli.py tests/integration/test_qualification.py || true
          ruff format src/researchforge/application/runner.py src/researchforge/application/qualification.py src/researchforge/cli.py tests/integration/test_qualification.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/researchforge/application/runner.py src/researchforge/application/qualification.py src/researchforge/cli.py tests/integration/test_qualification.py
            git commit -m "style(pr05): apply Ruff safe autofixes and formatting"
            git push origin HEAD:pr/05-hypothesis-qualification
          fi
