name: PR04 temporary mypy diagnostics
on:
  push:
    branches: ["pr/04-trusted-local-runner"]
permissions:
  contents: write
jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type checker
        run: python -m pip install -e '.[dev]'
      - name: Record PR04 type-check diagnostics
        run: |
          mypy src > .pr04_mypy_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr04_mypy_diagnostics.txt
          git commit -m "chore(pr04): capture temporary typecheck diagnostics"
          git push origin HEAD:pr/04-trusted-local-runner
