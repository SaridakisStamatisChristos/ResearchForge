name: PR06 temporary final formatter
on:
  push:
    branches: ["pr/06-statistics-sealed-final"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.8,<1"
      - name: Format touched modules
        run: |
          ruff format src/researchforge/application/final.py src/researchforge/cli.py tests/integration/test_final.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/researchforge/application/final.py src/researchforge/cli.py tests/integration/test_final.py
            git commit -m "style(pr06): format policy replay and regression tests"
            git push origin HEAD:pr/06-statistics-sealed-final
          fi
