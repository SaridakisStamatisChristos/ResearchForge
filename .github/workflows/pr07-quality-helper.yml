name: Temporary PR07 diagnostics
on:
  push:
    branches: ["pr/07-offline-demo-portable-skill"]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -e '.[dev]'
      - name: Normalize and capture quality issues
        run: |
          ruff check --fix src/researchforge/demo.py src/researchforge/portable_skills.py src/researchforge/cli.py tests/integration/test_demo.py || true
          ruff format src/researchforge/demo.py src/researchforge/portable_skills.py src/researchforge/cli.py tests/integration/test_demo.py
          {
            echo "== RUFF =="
            ruff check .
            echo "== RUFF FORMAT =="
            ruff format --check .
            echo "== MYPY =="
            mypy src
            echo "== PYTEST =="
            pytest -q --tb=short
          } > .pr07_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/researchforge/demo.py src/researchforge/portable_skills.py src/researchforge/cli.py tests/integration/test_demo.py .pr07_diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(pr07): apply quality formatting and capture diagnostics"
            git push origin HEAD:pr/07-offline-demo-portable-skill
          fi
