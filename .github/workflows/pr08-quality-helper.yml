name: Temporary PR08 code-quality diagnostics
on:
  push:
    branches: ["pr/08-literatureforge"]
permissions:
  contents: write
jobs:
  normalize-and-diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev,literature]'
      - name: Format and capture diagnostics
        run: |
          ruff check --fix src/researchforge/literature.py src/researchforge/literature_archive.py src/researchforge/cli.py tests/integration/test_literature.py || true
          ruff format src/researchforge/literature.py src/researchforge/literature_archive.py src/researchforge/cli.py tests/integration/test_literature.py
          {
            echo "==== RUFF ===="
            ruff check .
            echo "==== RUFF FORMAT ===="
            ruff format --check .
            echo "==== MYPY ===="
            mypy src
            echo "==== TESTS ===="
            pytest -q --tb=short
          } > .pr08_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/researchforge/literature.py src/researchforge/literature_archive.py src/researchforge/cli.py tests/integration/test_literature.py .pr08_diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "style(pr08): apply Ruff formatting and capture diagnostic failures"
            git push origin HEAD:pr/08-literatureforge
          fi
