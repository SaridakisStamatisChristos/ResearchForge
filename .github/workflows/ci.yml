name: ResearchForge full MVP quality
on:
  push:
    branches: [main, "pr/**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev,literature,case_studies]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Schema drift
        run: python tools/generate_schemas.py --check
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: rf --version && rf contracts schema --name evaluator-result > /dev/null
      - name: Real offline demonstration and independent replay
        run: |
          rf demo run --offline --output "${RUNNER_TEMP}/researchforge-mvp" > "${RUNNER_TEMP}/demo-output.json"
          rf verify --campaign "${RUNNER_TEMP}/researchforge-mvp/campaign" > /dev/null
          rf report --campaign "${RUNNER_TEMP}/researchforge-mvp/campaign" --format md > /dev/null
          rf skill validate --name researchforge-experiment > /dev/null
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"researchforge-mvp"/"summary.json"; s=json.loads(p.read_text()); assert s["decision_statuses"]=={"good":"QUALIFIED","overfit":"REJECTED"} and s["final_status"]=="FINAL_SUPPORTED"'

      - name: Real offline paired case studies with independent raw-log replay
        run: |
          python -m researchforge.case_demo --output "${RUNNER_TEMP}/researchforge-pr13-case-studies" > "${RUNNER_TEMP}/pr13-summary.json"
          rf cases verify --bundle "${RUNNER_TEMP}/researchforge-pr13-case-studies/sat/raw-bundle" > "${RUNNER_TEMP}/pr13-sat.json"
          rf cases verify --bundle "${RUNNER_TEMP}/researchforge-pr13-case-studies/shortest_path/raw-bundle" > "${RUNNER_TEMP}/pr13-graph.json"
      - name: Publish real fixture process raw logs and independent results
        uses: actions/upload-artifact@v4
        with:
          name: researchforge-pr13-case-studies-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/researchforge-pr13-case-studies/
            ${{ runner.temp }}/pr13-summary.json
            ${{ runner.temp }}/pr13-sat.json
            ${{ runner.temp }}/pr13-graph.json
          if-no-files-found: error
          retention-days: 30
      - name: Real third-party NetworkX 3.6.1 Dijkstra / Bellman-Ford case study
        run: |
          python -m researchforge.networkx_case_demo --output "${RUNNER_TEMP}/researchforge-upstream-networkx" > "${RUNNER_TEMP}/pr13-networkx-summary.json"
          rf cases verify --bundle "${RUNNER_TEMP}/researchforge-upstream-networkx/raw-bundle" > "${RUNNER_TEMP}/pr13-networkx-replay.json"
      - name: Archive third-party project raw logs and independent replay
        uses: actions/upload-artifact@v4
        with:
          name: researchforge-networkx-pr13-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/researchforge-upstream-networkx/
            ${{ runner.temp }}/pr13-networkx-summary.json
            ${{ runner.temp }}/pr13-networkx-replay.json
          if-no-files-found: error
          retention-days: 30
      - name: PR14 paired-agent mechanical control, full and ablation subprocess checks
        run: |
          python -m researchforge.uplift_fixture_demo --output "$RUNNER_TEMP/researchforge-pr14-uplift" > "$RUNNER_TEMP/pr14-original.json"
          rf uplift verify --bundle "$RUNNER_TEMP/researchforge-pr14-uplift" > "$RUNNER_TEMP/pr14-replay.json"
          rf uplift report --bundle "$RUNNER_TEMP/researchforge-pr14-uplift" --format md > "$RUNNER_TEMP/pr14-replay.md"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr14-replay.json"; r=json.loads(p.read_text()); assert r["provenance_class"]=="MECHANICAL_FIXTURE" and r["task_count"]==8 and len(r["comparisons"])==3 and not r["population_uplift_established"]'
      - name: Publish PR14 raw task logs, pinned plan, ablation and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: researchforge-pr14-uplift-fixture-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/researchforge-pr14-uplift/
            ${{ runner.temp }}/pr14-original.json
            ${{ runner.temp }}/pr14-replay.json
            ${{ runner.temp }}/pr14-replay.md
          if-no-files-found: error
          retention-days: 30
