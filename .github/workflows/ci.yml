name: ResearchForge full MVP quality
on:
  push:
    branches: [main, "pr/**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev,literature]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: |
          ruff format --diff .
          ruff format --check .
        continue-on-error: true
      - name: Mypy
        run: mypy src
        continue-on-error: true
      - name: Schema drift
        run: python tools/generate_schemas.py --check
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: rf --version && rf contracts schema --name evaluator-result > /dev/null
      - name: Real offline demonstration and independent replay
        run: |
          rf demo run --offline --output "${RUNNER_TEMP}/researchforge-mvp" > "${RUNNER_TEMP}/demo-output.json"
          rf verify --campaign "${RUNNER_TEMP}/researchforge-mvp/campaign" > /dev/null
          rf report --campaign "${RUNNER_TEMP}/researchforge-mvp/campaign" --format md > /dev/null
          rf skill validate --name researchforge-experiment > /dev/null
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"researchforge-mvp"/"summary.json"; s=json.loads(p.read_text()); assert s["decision_statuses"]=={"good":"QUALIFIED","overfit":"REJECTED"} and s["final_status"]=="FINAL_SUPPORTED"'

