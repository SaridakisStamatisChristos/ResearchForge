name: PR01 contracts and packaging
on:
  push:
    branches: [main, "pr/**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Schema drift
        run: python tools/generate_schemas.py --check
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: rf --version && rf contracts schema --name evaluator-result > /dev/null
