name: PR05 temporary quality diagnostics
on:
  push:
    branches: ["pr/05-hypothesis-qualification"]
permissions:
  contents: write
jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Record Ruff and mypy errors
        run: |
          ruff check . > .pr05_quality_diagnostics.txt 2>&1 || true
          ruff format --check . >> .pr05_quality_diagnostics.txt 2>&1 || true
          mypy src >> .pr05_quality_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr05_quality_diagnostics.txt
          git commit -m "chore(pr05): capture temporary quality diagnostics"
          git push origin HEAD:pr/05-hypothesis-qualification
