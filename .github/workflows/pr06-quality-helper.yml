name: Temporary PR06 quality diagnostics
on:
  push:
    branches: ["pr/06-statistics-sealed-final"]
permissions:
  contents: write
jobs:
  temporary-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Apply auto-fixable style and capture remaining quality issues
        run: |
          ruff check --fix src/researchforge/statistics.py src/researchforge/application/final.py src/researchforge/application/qualification.py src/researchforge/application/runner.py src/researchforge/cli.py tests/integration/test_final.py || true
          ruff format src/researchforge/statistics.py src/researchforge/application/final.py src/researchforge/application/qualification.py src/researchforge/application/runner.py src/researchforge/cli.py tests/integration/test_final.py
          {
            echo "==== RUFF ===="
            ruff check .
            echo "==== FORMAT ===="
            ruff format --check .
            echo "==== MYPY ===="
            mypy src
          } > .pr06_diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/researchforge/statistics.py src/researchforge/application/final.py src/researchforge/application/qualification.py src/researchforge/application/runner.py src/researchforge/cli.py tests/integration/test_final.py .pr06_diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(pr06): apply formatter and record temporary typecheck diagnostics"
            git push origin HEAD:pr/06-statistics-sealed-final
          fi
