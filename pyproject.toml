[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchforge"
version = "0.1.0"
description = "Local-first reproducible scientific experiment engineering"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
literature = ["httpx>=0.27,<1"]
case_studies = ["networkx==3.6.1"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.8,<1", "mypy>=1.12,<2"]

[project.scripts]
rf = "researchforge.uplift_cli:app"

[tool.setuptools.package-data]
researchforge = [
    "portable_skills/researchforge-experiment/SKILL.md",
    "portable_skills/researchforge-statistics/SKILL.md",
    "portable_skills/researchforge-literature/SKILL.md",
    "portable_skills/researchforge-audit/SKILL.md",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["researchforge"]
